# Native class system for the pkdarabi/cardetection ("Traffic Signs Detection") dataset.
# These are the dataset's OWN 15 Roboflow-export classes, kept as-is (no remapping).
# Order/ids match the Roboflow data.yaml (alphabetical).
# `inspect_dataset.py --write-configs` regenerates this file from the raw dataset data.yaml,
# so it can never drift from the actual labels. Used by both YOLO (names) and DETR (id -> name).

nc: 15
names:
  0: Green Light
  1: Red Light
  2: Speed Limit 10
  3: Speed Limit 100
  4: Speed Limit 110
  5: Speed Limit 120
  6: Speed Limit 20
  7: Speed Limit 30
  8: Speed Limit 40
  9: Speed Limit 50
  10: Speed Limit 60
  11: Speed Limit 70
  12: Speed Limit 80
  13: Speed Limit 90
  14: Stop
