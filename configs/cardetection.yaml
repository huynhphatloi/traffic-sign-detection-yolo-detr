# Ultralytics data config for the single pkdarabi/cardetection dataset.
# Paths are relative to THIS file's parent's parent (project root) the way Ultralytics
# resolves `path`. Built by `python -m src.data.prepare_dataset`.
# `names` must stay in sync with configs/classes.yaml (same order). Regenerate both with
# `python -m src.data.prepare_dataset --write-configs`.

path: ../data/processed/yolo/cardetection
train: images/train
val: images/val
test: images/test

nc: 15
names:
  - Green Light
  - Red Light
  - Speed Limit 10
  - Speed Limit 100
  - Speed Limit 110
  - Speed Limit 120
  - Speed Limit 20
  - Speed Limit 30
  - Speed Limit 40
  - Speed Limit 50
  - Speed Limit 60
  - Speed Limit 70
  - Speed Limit 80
  - Speed Limit 90
  - Stop
